<!DOCTYPE html>
<html lang="en">

  <style>
    /* ── Top Nav Bar (replaces sidebar) ──────────────── */

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);

      display: flex;
      gap: 8px;

    .tnav-btn {

      font-weight: 600;

      text-decoration: none;

      color: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.15);

    .tnav-btn-list:hover { background: rgba(255,255,255,.18); color: #fff; }

    /* ── No sidebar, full width main ─────────────────── */

    /* ── panel-head: icon LEFT, text right fix ─────── */
    /* Icon + text together on left */
    .panel-head {
      display: flex;
      align-items: center;
      gap: 7px;
      justify-content: flex-start;
    }
    /* Override prod-head to: icon+text LEFT, add-row btn RIGHT */
    .prod-head {
      justify-content: space-between;
      flex-direction: row;
    }
    .prod-head-left {
      display: flex;
      align-items: center;
      gap: 7px;

    /* ── Additional Charges panel: buttons inside ──── */

      border: none;

      padding: 5px 7px;
      border-radius: 6px;

    }
    .del-btn:hover { background: #991b1b !important; }

    /* Action bar hidden (buttons moved into charges panel) */

  </style>
</head>
<body>

      <!-- Patient -->

<!-- ━━━━━━━━━━━━━━━━━━━━━━ NOTIFICATION STACK ━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="notifStack"></div>

<script>
// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let rowCount = 0;
const DOCTORS = ['Dr. Rajesh Kumar','Dr. Priya Sharma','Dr. Arun Mehta','Dr. Sunita Patel','Dr. Vikram Singh','Dr. Deepa Nair'];

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  setInvoiceDate();
  loadInvoiceNo();
  addRow(); addRow(); addRow();
  calcGrandTotal();
  initDoctorAC();
  loadDoctorsFromDB();
});

function setInvoiceDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('invoiceDate').value = today;
}

async function loadInvoiceNo() {
  try {
    const r = await fetch('api.php?action=get_invoice_no');
    const d = await r.json();
    if (d.success) { setInvoiceDisplay(d.invoice_no); }
  } catch(_) {
    const t = new Date();
    const ds = t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') + String(t.getDate()).padStart(2,'0');
    setInvoiceDisplay('SAL-' + ds + '-777');
  }
}

function setInvoiceDisplay(no) {
  document.getElementById('invoiceNo').value = no;
}

// ═══════════════════════════════════════════════════
//  ROWS
// ═══════════════════════════════════════════════════
function addRow() {
  rowCount++;
  const id = rowCount;
  const tr = document.createElement('tr');
  tr.id = 'row-' + id;
  tr.innerHTML = `
    <td class="td-prod">
      <div class="ac-wrap" id="acWrap${id}">
        <input type="text" id="prodName${id}" placeholder="Search product…" autocomplete="off"
               oninput="searchProduct(${id})" />
        <div class="ac-drop hidden" id="acDrop${id}"></div>
      </div>
    </td>
    <td class="td-center">
      <label class="salt-chk">
        <input type="checkbox" id="saltChk${id}" onchange="toggleSaltSearch(${id})" />
        <span>S</span>
      </label>
    </td>
    <td><input type="number" id="qty${id}" value="1" min="1" oninput="calcRow(${id})" class="tbl-inp narrow" /></td>
    <td><input type="text" id="batch${id}" placeholder="—" readonly class="tbl-inp readonly-inp mid" /></td>
    <td><input type="text" id="expDate${id}" placeholder="MM/YY" readonly class="tbl-inp readonly-inp narrow" /></td>
    <td><input type="number" id="rate${id}" value="0.00" min="0" step="0.01" oninput="calcRow(${id})" class="tbl-inp mid" /></td>
    <td><input type="number" id="gst${id}" value="0.00" min="0" step="0.01" oninput="calcRow(${id})" class="tbl-inp narrow" /></td>
    <td><input type="number" id="mrp${id}" value="0.00" readonly class="tbl-inp readonly-inp mid" /></td>
    <td><input type="number" id="disc${id}" value="0.00" min="0" max="100" step="0.01" oninput="calcRow(${id})" class="tbl-inp narrow" /></td>
    <td class="td-total"><span id="total${id}">0.00</span></td>
    <td class="td-del">
      <button class="del-btn" onclick="removeRow(${id})" title="Delete row">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
               01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1
               1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </td>
  `;
  document.getElementById('productBody').appendChild(tr);

  document.addEventListener('click', e => {
    document.querySelectorAll('.ac-wrap').forEach(w => {
      if (!w.contains(e.target)) {
        const d = w.querySelector('.ac-drop');
        if (d) d.classList.add('hidden');
      }
    });
  });
}

function removeRow(id) {
  const r = document.getElementById('row-' + id);
  if (r) r.remove();
  calcGrandTotal();
}

// ═══════════════════════════════════════════════════
//  PRODUCT AUTOCOMPLETE
// ═══════════════════════════════════════════════════
let _timers = {};

function toggleSaltSearch(id) {
  const inp = document.getElementById('prodName' + id);
  if (inp.value.trim()) searchProduct(id);
}

async function searchProduct(id) {
  clearTimeout(_timers[id]);
  _timers[id] = setTimeout(async () => {
    const q = document.getElementById('prodName' + id).value.trim();
    const salt = document.getElementById('saltChk' + id).checked ? '1' : '0';
    const drop = document.getElementById('acDrop' + id);
    if (q.length < 2) { drop.classList.add('hidden'); return; }
    try {
      const r = await fetch(`api.php?action=search_product&q=${encodeURIComponent(q)}&salt=${salt}`);
      renderDrop(id, await r.json());
    } catch(_) {
      renderDrop(id, getSampleProducts().filter(p =>
        p.name.toLowerCase().includes(q.toLowerCase()) ||
        p.salt.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 8));
    }
  }, 200);
}

function renderDrop(id, products) {
  const drop = document.getElementById('acDrop' + id);
  if (!products.length) { drop.classList.add('hidden'); return; }
  drop.innerHTML = '';
  products.forEach(p => {
    const d = document.createElement('div');
    d.className = 'ac-item';
    d.innerHTML = `
      <span class="ac-name">${p.name}</span>
      <span class="ac-salt">${p.salt || 'N/A'}</span>
      <span class="ac-meta">Batch: ${p.batch_no} · Exp: ${p.expiry_date} · ₹${p.rate} · Stock: ${p.stock ?? '—'}</span>`;
    d.addEventListener('click', () => fillRow(id, p));
    drop.appendChild(d);
  });
  drop.classList.remove('hidden');
}

function fillRow(id, p) {
  document.getElementById('prodName' + id).value = p.name;
  document.getElementById('batch' + id).value = p.batch_no;
  document.getElementById('expDate' + id).value = p.expiry_date;
  document.getElementById('rate' + id).value = parseFloat(p.rate).toFixed(2);
  document.getElementById('gst' + id).value = parseFloat(p.gst_percent).toFixed(2);
  document.getElementById('mrp' + id).value = parseFloat(p.mrp).toFixed(2);
  document.getElementById('disc' + id).value = '0.00';
  document.getElementById('acDrop' + id).classList.add('hidden');
  calcRow(id);
}

// ═══════════════════════════════════════════════════
//  CALCULATIONS
// ═══════════════════════════════════════════════════
function calcRow(id) {
  const qty  = parseFloat(document.getElementById('qty'  + id).value) || 0;
  const rate = parseFloat(document.getElementById('rate' + id).value) || 0;
  const gst  = parseFloat(document.getElementById('gst'  + id).value) || 0;
  const disc = parseFloat(document.getElementById('disc' + id).value) || 0;

  const mrp = rate + (rate * gst / 100);
  document.getElementById('mrp' + id).value = mrp.toFixed(2);

  const gross = mrp * qty;
  const total = gross - (gross * disc / 100);
  document.getElementById('total' + id).textContent = total.toFixed(2);
  calcGrandTotal();
}

function calcGrandTotal() {
  let subtotal = 0, totalDisc = 0;

  document.querySelectorAll('#productBody tr').forEach(row => {
    const m = row.id.match(/row-(\d+)/);
    if (!m) return;
    const rid = m[1];
    const qty  = parseFloat(document.getElementById('qty'  + rid)?.value) || 0;
    const rate = parseFloat(document.getElementById('rate' + rid)?.value) || 0;
    const gst  = parseFloat(document.getElementById('gst'  + rid)?.value) || 0;
    const disc = parseFloat(document.getElementById('disc' + rid)?.value) || 0;
    const mrp  = rate + (rate * gst / 100);
    const gross= mrp * qty;
    const rowD = gross * disc / 100;
    subtotal  += (gross - rowD);
    totalDisc += rowD;
  });

  const lab = parseFloat(document.getElementById('labCharge').value) || 0;
  const doc = parseFloat(document.getElementById('doctorCharge').value) || 0;
  const inj = parseFloat(document.getElementById('injectionCharge').value) || 0;
  const nur = parseFloat(document.getElementById('nursingCharge').value) || 0;
  const addl = lab + doc + inj + nur;

  const pre  = subtotal + addl;
  const rounded = Math.round(pre);
  const rounding = (rounded - pre).toFixed(2);

  document.getElementById('sumDiscount').textContent    = totalDisc.toFixed(2);
  document.getElementById('sumSubtotal').textContent    = subtotal.toFixed(2);
  document.getElementById('sumAdditional').textContent  = addl.toFixed(2);
  document.getElementById('sumRounding').textContent    = rounding;
  document.getElementById('sumGrand').textContent       = '₹ ' + rounded.toFixed(2);
}

// ═══════════════════════════════════════════════════
//  DOCTOR AUTOCOMPLETE
// ═══════════════════════════════════════════════════
let doctorList = [...DOCTORS];

async function loadDoctorsFromDB() {
  try {
    const r = await fetch('api.php?action=get_doctors');
    const data = await r.json();
    if (Array.isArray(data) && data.length) {
      doctorList = data.map(d => d.name);
    }
  } catch(_) {}
}

function initDoctorAC() {
  const inp  = document.getElementById('doctorName');
  const drop = document.getElementById('doctorDropdown');
  inp.addEventListener('input', () => {
    const q = inp.value.toLowerCase();
    const matches = doctorList.filter(d => d.toLowerCase().includes(q));
    if (!matches.length || !q) { drop.classList.add('hidden'); return; }
    drop.innerHTML = matches.map(d =>
      `<div class="ac-item" onclick="pickDoctor('${d}')">
         <span class="ac-name">${d}</span>
       </div>`).join('');
    drop.classList.remove('hidden');
  });
  document.addEventListener('click', e => {
    if (!document.getElementById('doctorWrap').contains(e.target))
      drop.classList.add('hidden');
  });
}

function pickDoctor(name) {
  document.getElementById('doctorName').value = name;
  document.getElementById('doctorDropdown').classList.add('hidden');
}

// ═══════════════════════════════════════════════════
//  SAVE SALE
// ═══════════════════════════════════════════════════
async function saveSale(status) {
  const patientName = document.getElementById('patientName').value.trim();
  if (!patientName) {
    pushNotif('Patient name is required before saving.', 'warn');
    return;
  }

  const items = [];
  document.querySelectorAll('#productBody tr').forEach(row => {
    const m = row.id.match(/row-(\d+)/);
    if (!m) return;
    const rid = m[1];
    const pname = document.getElementById('prodName' + rid)?.value.trim();
    if (!pname) return;
    items.push({
      product_name:  pname,
      salt:          '',
      batch_no:      document.getElementById('batch'   + rid)?.value || '',
      expiry_date:   document.getElementById('expDate' + rid)?.value || '',
      qty:           parseInt(document.getElementById('qty'  + rid)?.value) || 1,
      rate:          parseFloat(document.getElementById('rate' + rid)?.value) || 0,
      gst_percent:   parseFloat(document.getElementById('gst'  + rid)?.value) || 0,
      mrp:           parseFloat(document.getElementById('mrp'  + rid)?.value) || 0,
      disc_percent:  parseFloat(document.getElementById('disc' + rid)?.value) || 0,
      total:         parseFloat(document.getElementById('total'+ rid)?.textContent) || 0,
    });
  });

  if (!items.length) {
    pushNotif('Add at least one product to continue.', 'warn');
    return;
  }

  const payload = {
    patient_name:    patientName,
    patient_phone:   document.getElementById('patientPhone').value,
    patient_address: document.getElementById('patientAddress').value,
    doctor_name:     document.getElementById('doctorName').value,
    reminder:        document.getElementById('reminderChk').checked ? 1 : 0,
    invoice_date:    document.getElementById('invoiceDate').value,
    lab_charge:        parseFloat(document.getElementById('labCharge').value) || 0,
    doctor_charge:     parseFloat(document.getElementById('doctorCharge').value) || 0,
    injection_charge:  parseFloat(document.getElementById('injectionCharge').value) || 0,
    nursing_charge:    parseFloat(document.getElementById('nursingCharge').value) || 0,
    total_discount:    parseFloat(document.getElementById('sumDiscount').textContent) || 0,
    product_subtotal:  parseFloat(document.getElementById('sumSubtotal').textContent) || 0,
    additional_charges:parseFloat(document.getElementById('sumAdditional').textContent) || 0,
    bulk_discount:     0,
    rounding_off:      parseFloat(document.getElementById('sumRounding').textContent) || 0,
    grand_total:       parseFloat(document.getElementById('sumGrand').textContent.replace('₹ ','')) || 0,
    status,
    items,
  };

  try {
    const r = await fetch('api.php?action=save_sale', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (d.success) {
      setInvoiceDisplay(d.invoice_no);
      pushNotif('Invoice ' + d.invoice_no + ' saved successfully!', 'ok');
      if (status === 'saved') {
        setTimeout(() => window.open('print_invoice.php?id=' + d.sale_id, '_blank'), 700);
      } else {
        setTimeout(() => window.location.href = 'sales_list.php', 1100);
      }
    } else {
      pushNotif('Could not save: ' + d.message, 'err');
    }
  } catch(_) {
    pushNotif('Server unreachable — running in demo mode.', 'info');
  }
}

// ═══════════════════════════════════════════════════
//  NOTIFICATION STACK
// ═══════════════════════════════════════════════════
function pushNotif(msg, type = 'ok') {
  const stack = document.getElementById('notifStack');
  const el = document.createElement('div');
  el.className = 'notif notif-' + type;

  const icons = {
    ok:   '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    warn: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
    err:  '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    info: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
  };

  el.innerHTML = `
    <span class="notif-icon">${icons[type] || icons.info}</span>
    <span class="notif-msg">${msg}</span>
    <button class="notif-close" onclick="this.parentElement.remove()">✕</button>
  `;
  stack.prepend(el);
  requestAnimationFrame(() => el.classList.add('notif-in'));
  setTimeout(() => { el.classList.remove('notif-in'); setTimeout(() => el.remove(), 400); }, 4000);
}
